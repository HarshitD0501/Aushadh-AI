[project]
name = "aushadh-voice"
version = "0.1.0"
description = "AushadhAi LiveKit voice worker"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents~=1.8",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aushadh_voice"]
