[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aushadhai-backend"
version = "0.1.0"
description = "Verified medicine price information API for AushadhAi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "Pillow>=11,<13",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.14,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
